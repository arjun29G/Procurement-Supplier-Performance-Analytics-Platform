<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Procurement &amp; Supplier Performance Analytics</title>
<style>
:root {
  --bg:#f4f6f8; --card:#ffffff; --ink:#1f2933; --muted:#52606d;
  --line:#d9e2ec; --accent:#0f4c5c; --accent2:#1b6b7a; --warn:#b45309;
  --risk:#9b1c1c; --ok:#05603a; --chip:#e6fffa;
}
* { box-sizing:border-box; }
body { margin:0; font-family:"Segoe UI", "Source Sans 3", sans-serif; background:var(--bg); color:var(--ink); }
header { background:linear-gradient(120deg,#0f4c5c,#1b6b7a 55%,#3a7d6e); color:#fff; padding:18px 28px; }
header h1 { margin:0 0 4px; font-size:22px; font-weight:650; letter-spacing:.2px; }
header p { margin:0; opacity:.92; font-size:13px; }
.nav { display:flex; gap:8px; flex-wrap:wrap; padding:12px 20px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
.nav button { border:1px solid var(--line); background:#fff; color:var(--muted); padding:8px 12px; border-radius:999px; cursor:pointer; font-size:12px; }
.nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
main { padding:18px 20px 40px; }
.page { display:none; }
.page.active { display:block; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.kpi .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.kpi .value { font-size:22px; font-weight:700; margin-top:6px; color:var(--accent); }
.kpi.muted .value { color:var(--warn); font-size:16px; }
.grid { display:grid; grid-template-columns:1.2fr 1fr; gap:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
.card h2 { margin:0 0 10px; font-size:15px; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th, td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:600; }
.note { background:#fff7ed; border:1px solid #fbd38d; color:#7c2d12; border-radius:10px; padding:10px 12px; font-size:12px; margin-bottom:14px; }
.bars { display:flex; flex-direction:column; gap:8px; }
.bar-row { display:grid; grid-template-columns:140px 1fr 70px; gap:8px; align-items:center; font-size:12px; }
.bar-track { height:10px; background:#edf2f7; border-radius:999px; overflow:hidden; }
.bar-fill { height:100%; background:var(--accent2); }
.chart { width:100%; height:220px; }
.badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; background:var(--chip); color:var(--ok); }
.badge.watch { background:#fff7ed; color:var(--warn); }
.badge.under { background:#fef2f2; color:var(--risk); }
.badge.insuff { background:#f0f4f8; color:var(--muted); }
footer { padding:10px 20px 24px; color:var(--muted); font-size:11px; }
@media (max-width:900px) { .grid { grid-template-columns:1fr; } }
</style>
</head>

function badge(status) {
  if (!status) return '';
  let cls = '';
  if (status.includes('Watch')) cls='watch';
  else if (status.includes('Under')) cls='under';
  else if (status.includes('Insufficient')) cls='insuff';
  return `<span class="badge ${cls}">${status}</span>`;
}

function kpi(label, value, muted=false) {
  return `<div class="kpi ${muted?'muted':''}"><div class="label">${label}</div><div class="value">${value}</div></div>`;
}

function barList(rows, nameKey, valueKey) {
  const max = Math.max(...rows.map(r => Number(r[valueKey])||0), 1);
  return `<div class="bars">${rows.map(r => {
    const v = Number(r[valueKey])||0;
    const w = (v/max*100).toFixed(1);
    return `<div class="bar-row"><div>${r[nameKey]||'—'}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><div>${money(v)}</div></div>`;
  }).join('')}</div>`;
}

function svgLine(points, color='#1b6b7a') {
  if (!points.length) return '';
  const vals = points.map(p => p.y);
  const min = Math.min(...vals), max = Math.max(...vals);
  const w=640, h=200, p=20;
  const coords = points.map((pt,i) => {
    const x = p + i*(w-2*p)/Math.max(points.length-1,1);
    const y = h-p - ((pt.y-min)/(max-min||1))*(h-2*p);
    return [x,y];
  });
  const poly = coords.map(c => c.join(',')).join(' ');
  const labels = points.map((pt,i) => `<text x="${coords[i][0]}" y="${h-4}" font-size="9" text-anchor="middle" fill="#52606d">${pt.x}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="3" points="${poly}"/>${labels}</svg>`;
}

function svgBars(items) {
  const w=640,h=200,p=30;
  const max = Math.max(...items.map(i=>i.v),1);
  const bw = (w-2*p)/items.length - 8;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${items.map((it,i) => {
    const bh = (it.v/max)*(h-2*p);
    const x = p + i*((w-2*p)/items.length);
    const y = h-p-bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="#0f4c5c"/><text x="${x+bw/2}" y="${h-8}" font-size="9" text-anchor="middle" fill="#52606d">${it.l}</text><text x="${x+bw/2}" y="${y-4}" font-size="9" text-anchor="middle" fill="#1f2933">${it.v}</text>`;
  }).join('')}</svg>`;
}
